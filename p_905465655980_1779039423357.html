<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sas Deniz Seyahat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --purple-dark: #2d0057;
    --purple-main: #6a0dad;
    --purple-mid: #8b2fc9;
    --purple-light: #b46de8;
    --purple-pale: #f3e8ff;
    --purple-accent: #c084fc;
    --white: #ffffff;
    --gray-light: #f8f4ff;
    --gray-text: #555;
    --shadow: 0 8px 32px rgba(106,13,173,0.15);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: #333;
    overflow-x: hidden;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(45, 0, 87, 0.95);
    backdrop-filter: blur(10px);
    padding: 14px 0;
    transition: all 0.3s ease;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo .logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--purple-light), var(--purple-accent));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: white;
  }

  .nav-logo span {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--white);
    letter-spacing: 2px;
    font-family: 'Playfair Display', serif;
  }

  .nav-logo small {
    display: block;
    font-size: 0.6rem;
    color: var(--purple-accent);
    letter-spacing: 3px;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 32px;
  }

  .nav-links a {
    text-decoration: none;
    color: rgba(255,255,255,0.85);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--purple-accent);
    transition: width 0.3s;
  }

  .nav-links a:hover { color: var(--white); }
  .nav-links a:hover::after { width: 100%; }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }

  .hamburger span {
    width: 25px;
    height: 2px;
    background: white;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

  /* ===== HERO ===== */
  #hero {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-main) 50%, #1a0040 100%);
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .hero-waves {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    overflow: hidden;
    line-height: 0;
  }

  .hero-waves svg {
    position: relative;
    display: block;
    width: 100%;
    height: 120px;
  }

  .hero-particles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(196, 132, 252, 0.15);
    animation: float-particle 8s infinite ease-in-out;
  }

  @keyframes float-particle {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
    50% { transform: translateY(-30px) rotate(180deg); opacity: 0.7; }
  }

  .hero-bg-shapes {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .hero-bg-shapes .shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.25;
  }

  .shape-1 {
    width: 500px; height: 500px;
    background: var(--purple-light);
    top: -100px; right: -100px;
  }

  .shape-2 {
    width: 300px; height: 300px;
    background: var(--purple-accent);
    bottom: 100px; left: -80px;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 120px 24px 160px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }

  .hero-text .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(196,132,252,0.2);
    border: 1px solid rgba(196,132,252,0.4);
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 0.78rem;
    color: var(--purple-accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 3.8rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 20px;
  }

  .hero-text h1 span {
    background: linear-gradient(135deg, var(--purple-accent), #e879f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-text p {
    font-size: 1.05rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.8;
    margin-bottom: 36px;
    max-width: 480px;
  }

  .hero-cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--purple-light), var(--purple-accent));
    color: white;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(180,109,232,0.4);
    border: none;
    cursor: pointer;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(180,109,232,0.6);
    background: linear-gradient(135deg, var(--purple-accent), #e879f9);
  }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: white;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    border: 2px solid rgba(255,255,255,0.4);
    cursor: pointer;
  }

  .btn-outline:hover {
    background: rgba(255,255,255,0.1);
    border-color: white;
    transform: translateY(-3px);
  }

  .hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .hero-card-main {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    color: white;
    width: 320px;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .hero-card-main .ship-icon {
    font-size: 5rem;
    margin-bottom: 16px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(196,132,252,0.5));
  }

  .hero-card-main h3 {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .hero-card-main p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
    line-height: 1.6;
  }

  .hero-stat-cards {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 12px;
    right: -20px;
  }

  .stat-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 14px 20px;
    color: white;
    min-width: 130px;
  }

  .stat-card .stat-num {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--purple-accent);
    display: block;
  }

  .stat-card .stat-label {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.7);
    display: block;
  }

  .hero-stats-bottom {
    display: flex;
    gap: 40px;
    margin-top: 36px;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.15);
  }

  .hero-stat {
    text-align: center;
  }

  .hero-stat strong {
    display: block;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--purple-accent);
  }

  .hero-stat span {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ===== SECTIONS COMMON ===== */
  section {
    padding: 90px 0;
  }

  .section-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    background: var(--purple-pale);
    color: var(--purple-main);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 50px;
    margin-bottom: 14px;
    border: 1px solid rgba(106,13,173,0.15);
  }

  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    color: var(--purple-dark);
    line-height: 1.3;
    margin-bottom: 14px;
  }

  .section-header p {
    font-size: 1rem;
    color: var(--gray-text);
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.8;
  }

  .divider {
    width: 60px;
    height: 4px;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-accent));
    border-radius: 2px;
    margin: 16px auto 0;
  }

  /* ===== HİZMETLER ===== */
  #hizmetler {
    background: var(--gray-light);
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .service-card {
    background: white;
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    transition: all 0.4s ease;
    border: 1px solid rgba(106,13,173,0.08);
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-accent));
    transform: scaleX(0);
    transition: transform 0.4s ease;
  }

  .service-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(106,13,173,0.15);
    border-color: rgba(106,13,173,0.15);
  }

  .service-card:hover::before { transform: scaleX(1); }

  .service-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, var(--purple-pale), #e9d5ff);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 1.8rem;
    color: var(--purple-main);
    transition: all 0.4s ease;
  }

  .service-card:hover .service-icon {
    background: linear-gradient(135deg, var(--purple-main), var(--purple-accent));
    color: white;
    transform: scale(1.1) rotate(5deg);
  }

  .service-card h3 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--purple-dark);
    margin-bottom: 12px;
  }

  .service-card p {
    font-size: 0.88rem;
    color: var(--gray-text);
    line-height: 1.75;
  }

  .service-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    color: var(--purple-main);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: gap 0.3s;
  }

  .service-link:hover { gap: 10px; }

  /* ===== HAKKIMIZDA ===== */
  #hakkimizda {
    background: white;
    overflow: hidden;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 70px;
    align-items: center;
  }

  .about-visual {
    position: relative;
  }

  .about-img-box {
    background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-main) 100%);
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    color: white;
    position: relative;
    overflow: hidden;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .about-img-box::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }

  .about-img-box::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 150px; height: 150px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }

  .about-img-icon {
    font-size: 5rem;
    filter: drop-shadow(0 0 20px rgba(196,132,252,0.6));
    animation: float 5s ease-in-out infinite;
    display: block;
  }

  .about-img-box h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
  }

  .about-img-box p {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.7;
    max-width: 280px;
  }

  .about-badge {
    position: absolute;
    bottom: -16px;
    right: 30px;
    background: white;
    border-radius: 14px;
    padding: 14px 22px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .about-badge .badge-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .about-badge strong {
    display: block;
    font-size: 1.1rem;
    color: var(--purple-dark);
    font-weight: 800;
  }

  .about-badge small {
    font-size: 0.72rem;
    color: var(--gray-text);
  }

  .about-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3.5vw, 2.4rem);
    font-weight: 700;
    color: var(--purple-dark);
    line-height: 1.3;
    margin-bottom: 20px;
  }

  .about-content h2 span {
    color: var(--purple-main);
  }

  .about-content p {
    font-size: 0.95rem;
    color: var(--gray-text);
    line-height: 1.85;
    margin-bottom: 16px;
  }

  .about-features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 28px 0;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    color: var(--purple-dark);
    font-weight: 500;
  }

  .feature-item .fi-icon {
    width: 28px;
    height: 28px;
    background: var(--purple-pale);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--purple-main);
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .about-numbers {
    display: flex;
    gap: 30px;
    padding-top: 24px;
    border-top: 1px solid rgba(106,13,173,0.1);
    margin-top: 8px;
  }

  .about-num {
    text-align: center;
  }

  .about-num strong {
    display: block;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--purple-main);
    line-height: 1;
    margin-bottom: 4px;
  }

  .about-num span {
    font-size: 0.75rem;
    color: var(--gray-text);
  }

  /* ===== WHY US BANNER ===== */
  .why-banner {
    background: linear-gradient(135deg, var(--purple-dark), var(--purple-main));
    padding: 70px 0;
    position: relative;
    overflow: hidden;
  }

  .why-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .why-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
    position: relative;
    z-index: 1;
  }

  .why-item {
    text-align: center;
    color: white;
    padding: 20px;
  }

  .why-item .wi-icon {
    font-size: 2.2rem;
    color: var(--purple-accent);
    margin-bottom: 14px;
    display: block;
  }

  .why-item h4 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .why-item p {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.7);
    line-height: 1.7;
  }

  /* ===== İLETİŞİM ===== */
  #iletisim {
    background: var(--gray-light);
  }

  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 50px;
    align-items: start;
  }

  .contact-info h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--purple-dark);
    margin-bottom: 14px;
  }

  .contact-info > p {
    font-size: 0.92rem;
    color: var(--gray-text);
    line-height: 1.8;
    margin-bottom: 32px;
  }

  .contact-items {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .contact-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 18px;
    background: white;
    border-radius: 14px;
    border: 1px solid rgba(106,13,173,0.08);
    transition: all 0.3s ease;
  }

  .contact-item:hover {
    border-color: var(--purple-light);
    box-shadow: 0 4px 20px rgba(106,13,173,0.1);
    transform: translateX(4px);
  }

  .contact-item .ci-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-accent));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .contact-item .ci-text strong {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--purple-dark);
    margin-bottom: 2px;
  }

  .contact-item .ci-text span {
    font-size: 0.82rem;
    color: var(--gray-text);
  }

  .contact-form-box {
    background: white;
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 8px 40px rgba(106,13,173,0.1);
    border: 1px solid rgba(106,13,173,0.08);
  }

  .contact-form-box h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--purple-dark);
    margin-bottom: 24px;
    font-weight: 700;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--purple-dark);
    margin-bottom: 7px;
    letter-spacing: 0.3px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid rgba(106,13,173,0.12);
    border-radius: 10px;
    font-size: 0.9rem;
    font-family: 'Poppins', sans-serif;
    color: #333;
    outline: none;
