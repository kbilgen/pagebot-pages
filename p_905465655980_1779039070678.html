<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deniz Seyahat - Hayalinizdeki Tatile Giden Yol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple-dark: #3a0060;
            --purple-main: #6a0dad;
            --purple-mid: #8b2fc9;
            --purple-light: #b06ce0;
            --purple-pale: #e8d5f5;
            --purple-ultra-light: #f5eeff;
            --white: #ffffff;
            --gray-light: #f8f8fc;
            --gray-text: #555566;
            --dark-text: #1a1a2e;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark-text);
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(58, 0, 96, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        nav.scrolled {
            padding: 12px 5%;
            background: rgba(58, 0, 96, 0.98);
            box-shadow: 0 4px 30px rgba(106,13,173,0.4);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--purple-light), var(--purple-mid));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 15px rgba(176,108,224,0.5);
        }

        .nav-logo span {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.5px;
        }

        .nav-logo span em {
            font-style: normal;
            color: var(--purple-light);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--purple-light);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--purple-mid), var(--purple-light));
            color: white !important;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600 !important;
            box-shadow: 0 4px 15px rgba(176,108,224,0.4);
            transition: transform 0.3s, box-shadow 0.3s !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(176,108,224,0.6) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: var(--purple-dark);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }

        .mobile-menu.active {
            display: flex;
        }

        .mobile-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .mobile-menu a:hover {
            color: var(--purple-light);
        }

        .close-menu {
            position: absolute;
            top: 20px;
            right: 5%;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }

        /* ===== HERO ===== */
        #hero {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-main) 45%, var(--purple-mid) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 5% 80px;
            position: relative;
            overflow: hidden;
        }

        #hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(176,108,224,0.15) 0%, transparent 60%);
            animation: pulse 6s ease-in-out infinite;
        }

        #hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, transparent, var(--white));
            pointer-events: none;
        }

        .hero-shapes {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }

        .shape-1 { width: 300px; height: 300px; top: -100px; right: -80px; }
        .shape-2 { width: 200px; height: 200px; bottom: 100px; left: -60px; }
        .shape-3 { width: 150px; height: 150px; top: 30%; right: 10%; background: rgba(176,108,224,0.1); }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--purple-pale);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 28px;
            backdrop-filter: blur(8px);
        }

        .hero-badge i {
            color: var(--purple-light);
            font-size: 0.9rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 700;
            color: var(--white);
            line-height: 1.2;
            margin-bottom: 22px;
        }

        .hero-title span {
            background: linear-gradient(135deg, var(--purple-pale), var(--purple-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            color: rgba(255,255,255,0.8);
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #b06ce0, #8b2fc9);
            color: white;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(176,108,224,0.5);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(176,108,224,0.65);
            background: linear-gradient(135deg, #c080f0, #9a3fd8);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 2px solid rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.8);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--white);
            display: block;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.65);
            margin-top: 5px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== SECTION COMMONS ===== */
        section {
            padding: 90px 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-block;
            background: var(--purple-pale);
            color: var(--purple-main);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .section-title span {
            color: var(--purple-main);
        }

        .section-desc {
            font-size: 1rem;
            color: var(--gray-text);
            max-width: 580px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* ===== HİZMETLER ===== */
        #hizmetler {
            background: var(--gray-light);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(106,13,173,0.07);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(176,108,224,0.1);
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--purple-main), var(--purple-light));
            transform: scaleX(0);
            transition: transform 0.35s ease;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(106,13,173,0.15);
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--purple-pale), #d5a6f0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2rem;
            color: var(--purple-main);
            transition: all 0.35s ease;
        }

        .service-card:hover .service-icon {
            background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
            color: white;
            transform: scale(1.1);
        }

        .service-card h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 12px;
        }

        .service-card p {
            font-size: 0.92rem;
            color: var(--gray-text);
            line-height: 1.7;
        }

        .service-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--purple-main);
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            margin-top: 20px;
            transition: gap 0.3s;
        }

        .service-link:hover {
            gap: 10px;
        }

        /* ===== HAKKIMIZDA ===== */
        #hakkimizda {
            background: var(--white);
        }

        .about-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .about-image-wrap {
            position: relative;
        }

        .about-img-main {
            width: 100%;
            height: 500px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .about-img-main i {
            font-size: 8rem;
            color: rgba(255,255,255,0.15);
            position: absolute;
        }

        .about-img-inner {
            text-align: center;
            z-index: 2;
            padding: 40px;
        }

        .about-img-inner .big-icon {
            font-size: 5rem;
            color: rgba(255,255,255,0.9);
            display: block;
            margin-bottom: 20px;
        }

        .about-img-inner p {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            line-height: 1.7;
        }

        .about-img-inner strong {
            color: white;
            display: block;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .about-badge-float {
            position: absolute;
            bottom: -20px;
            right: -20px;
            background: linear-gradient(135deg, var(--purple-light), var(--purple-mid));
            color: white;
            padding: 20px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(106,13,173,0.3);
            text-align: center;
        }

        .about-badge-float strong {
            display: block;
            font-size: 2rem;
            font-weight: 800;
        }

        .about-badge-float span {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .about-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .about-content h2 span {
            color: var(--purple-main);
        }

        .about-content p {
            color: var(--gray-text);
            line-height: 1.8;
            margin-bottom: 18px;
            font-size: 0.97rem;
        }

        .about-features {
            list-style: none;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .about-features li {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.95rem;
            color: var(--dark-text);
            font-weight: 500;
        }

        .about-features li i {
            width: 36px;
            height: 36px;
            background: var(--purple-pale);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple-main);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .about-cta {
            margin-top: 10px;
        }

        /* ===== DESTİNASYONLAR ===== */
        #destinasyonlar {
            background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-main) 100%);
            padding: 90px 5%;
        }

        #destinasyonlar .section-tag {
            background: rgba(255,255,255,0.15);
            color: var(--purple-pale);
        }

        #destinasyonlar .section-title {
            color: white;
        }

        #destinasyonlar .section-title span {
            color: var(--purple-pale);
        }

        #destinasyonlar .section-desc {
            color: rgba(255,255,255,0.75);
        }

        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dest-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 32px 24px;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.35s ease;
            cursor: pointer;
        }

        .dest-card:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.35);
        }

        .dest-flag {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
        }

        .dest-card h3 {
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .dest-card p {
            color: rgba(255,255,255,0.65);
            font-size: 0.82rem;
            line-height: 1.5;
        }

        /* ===== İLETİŞİM ===== */
        #iletisim {
            background: var(--gray-light);
        }

        .contact-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 50px;
            align-items: start;
        }

        .contact-info h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 16px;
        }

        .contact-info p {
            color: var(--gray-text);
            line-height: 1.8;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .contact-items {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .contact-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(106,13,173,0.25);
        }

        .contact-item-text strong {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--purple-main);
            margin-bottom: 3px;
        }

        .contact-item-text span {
            font-size: 0.95rem;
            color: var(--dark-text);
            font-weight: 500;
        }

        .contact-form {
            background: white;
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 8px 40px rgba(106,13,173,0.1);
        }

        .contact-form h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 28px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px 18px;
            border: 2px solid var(--purple-pale);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: var(--dark-text);
            background: var(--purple-ultra-light);
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--purple-main);
            box-shadow: 0 0 0 4px rgba(106,13,173,0.1);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(106,13,173,0.35);
            transition: all 0.3s ease;
        }

        .form-submit:hover {
            background: linear-gradient(135deg, var(--purple-dark), var(--purple-main));
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(106,13,173,0.45);
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--purple-dark);
            color: rgba(255,255,255,0.8);
            padding: 60px 5% 30px;
        }

        .footer-top {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 50px;
        }

        .footer-brand .nav-logo {
            margin-bottom: 20px;
            display: inline-flex;
        }

        .footer-brand p {
            font-size: 0.88rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.6);
            margin-bottom: 24px;
        }
