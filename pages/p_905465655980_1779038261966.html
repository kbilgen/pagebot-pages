<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deniz Seyahat - Seyahat Acentası</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #7c3aed;
    --primary-dark: #5b21b6;
    --primary-light: #a855f7;
    --accent: #c084fc;
    --accent2: #e879f9;
    --white: #ffffff;
    --light: #f5f3ff;
    --gray: #6b7280;
    --dark: #1e1b4b;
    --text: #374151;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(30, 27, 75, 0.95);
    backdrop-filter: blur(12px);
    padding: 15px 0;
    transition: all 0.3s ease;
    box-shadow: 0 2px 20px rgba(124, 58, 237, 0.3);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.5px;
  }

  .logo-text span {
    color: var(--accent);
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 35px;
    align-items: center;
  }

  .nav-links a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.3s;
  }

  .nav-links a:hover {
    color: var(--accent);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: linear-gradient(135deg, var(--primary), var(--primary-light)) !important;
    color: white !important;
    padding: 9px 22px !important;
    border-radius: 25px !important;
    font-weight: 600 !important;
    transition: transform 0.3s, box-shadow 0.3s !important;
  }

  .nav-cta::after {
    display: none !important;
  }

  .nav-cta:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.5) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }

  .hamburger span {
    width: 25px;
    height: 3px;
    background: white;
    border-radius: 3px;
    transition: all 0.3s;
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 40%, #7c3aed 70%, #a855f7 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding-top: 80px;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(232, 121, 249, 0.2) 0%, transparent 70%);
    animation: float 8s ease-in-out infinite;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.3) 0%, transparent 70%);
    animation: float 6s ease-in-out infinite reverse;
  }

  .hero-particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  .hero-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    padding: 8px 18px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 25px;
    animation: fadeInDown 0.8s ease;
  }

  .hero-badge i {
    color: var(--accent);
  }

  .hero-title {
    font-size: clamp(36px, 5vw, 62px);
    font-weight: 800;
    color: white;
    line-height: 1.15;
    margin-bottom: 20px;
    animation: fadeInUp 0.8s ease 0.2s both;
  }

  .hero-title .highlight {
    background: linear-gradient(135deg, #c084fc, #e879f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-desc {
    font-size: 17px;
    color: rgba(255,255,255,0.8);
    line-height: 1.7;
    margin-bottom: 35px;
    animation: fadeInUp 0.8s ease 0.4s both;
  }

  .hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    animation: fadeInUp 0.8s ease 0.6s both;
  }

  .btn-primary {
    background: linear-gradient(135deg, #e879f9, #a855f7);
    color: white;
    padding: 15px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    box-shadow: 0 10px 30px rgba(232, 121, 249, 0.4);
    border: none;
    cursor: pointer;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(232, 121, 249, 0.6);
  }

  .btn-outline {
    background: transparent;
    color: white;
    padding: 15px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 2px solid rgba(255,255,255,0.4);
    transition: all 0.3s;
  }

  .btn-outline:hover {
    background: rgba(255,255,255,0.15);
    border-color: white;
    transform: translateY(-3px);
  }

  .hero-stats {
    display: flex;
    gap: 30px;
    margin-top: 45px;
    animation: fadeInUp 0.8s ease 0.8s both;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 800;
    color: white;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 3px;
  }

  .stat-divider {
    width: 1px;
    background: rgba(255,255,255,0.2);
  }

  .hero-visual {
    position: relative;
    animation: fadeInRight 1s ease 0.4s both;
  }

  .hero-card-main {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 30px;
    position: relative;
    overflow: hidden;
  }

  .hero-card-main::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-light), var(--accent2));
  }

  .dest-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
  }

  .dest-item {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .dest-item:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.03);
  }

  .dest-emoji {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .dest-name {
    color: white;
    font-size: 13px;
    font-weight: 600;
  }

  .dest-price {
    color: var(--accent);
    font-size: 12px;
    margin-top: 3px;
  }

  .hero-card-promo {
    background: linear-gradient(135deg, rgba(232, 121, 249, 0.3), rgba(124, 58, 237, 0.3));
    border: 1px solid rgba(232, 121, 249, 0.4);
    border-radius: 14px;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .promo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .promo-text strong {
    display: block;
    color: white;
    font-size: 14px;
  }

  .promo-text span {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
  }

  .floating-badge {
    position: absolute;
    top: -15px;
    right: -15px;
    background: linear-gradient(135deg, #e879f9, #7c3aed);
    color: white;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 8px 20px rgba(232, 121, 249, 0.5);
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ===== SECTION COMMON ===== */
  section {
    padding: 100px 0;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--light);
    color: var(--primary);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 15px;
  }

  .section-title {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 15px;
  }

  .section-title span {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .section-desc {
    font-size: 16px;
    color: var(--gray);
    line-height: 1.7;
    max-width: 600px;
  }

  .section-header {
    margin-bottom: 60px;
  }

  .section-header.center {
    text-align: center;
  }

  .section-header.center .section-desc {
    margin: 0 auto;
  }

  /* ===== SERVICES ===== */
  .services {
    background: #faf9ff;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
  }

  .service-card {
    background: white;
    border-radius: 20px;
    padding: 35px 28px;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
    border: 1px solid #ede9fe;
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.05);
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transform: scaleX(0);
    transition: transform 0.3s;
  }

  .service-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
    border-color: var(--accent);
  }

  .service-card:hover::before {
    transform: scaleX(1);
  }

  .service-icon {
    width: 65px;
    height: 65px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }

  .icon-purple { background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: var(--primary); }
  .icon-pink { background: linear-gradient(135deg, #fdf4ff, #fae8ff); color: var(--accent2); }
  .icon-blue { background: linear-gradient(135deg, #eff6ff, #dbeafe); color: #3b82f6; }
  .icon-green { background: linear-gradient(135deg, #f0fdf4, #dcfce7); color: #22c55e; }
  .icon-orange { background: linear-gradient(135deg, #fff7ed, #fed7aa); color: #f97316; }
  .icon-teal { background: linear-gradient(135deg, #f0fdfa, #ccfbf1); color: #14b8a6; }

  .service-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 12px;
  }

  .service-desc {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .service-link {
    color: var(--primary);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: gap 0.3s;
  }

  .service-link:hover {
    gap: 10px;
  }

  /* ===== ABOUT ===== */
  .about {
    background: white;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .about-visual {
    position: relative;
  }

  .about-main-card {
    background: linear-gradient(135deg, #4c1d95, #7c3aed);
    border-radius: 24px;
    padding: 40px;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .about-main-card::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(232, 121, 249, 0.3) 0%, transparent 70%);
  }

  .about-card-icon {
    font-size: 50px;
    margin-bottom: 20px;
  }

  .about-card-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .about-card-text {
    font-size: 14px;
    opacity: 0.85;
    line-height: 1.7;
  }

  .about-mini-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
  }

  .mini-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(124, 58, 237, 0.15);
    transition: transform 0.3s;
  }

  .mini-card:hover {
    transform: translateY(-5px);
  }

  .mini-card-num {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .mini-card-label {
    font-size: 12px;
    color: var(--gray);
    margin-top: 4px;
  }

  .about-content .section-desc {
    max-width: 100%;
    margin-bottom: 25px;
  }

  .about-features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 35px;
  }

  .about-features li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 15px;
    color: var(--text);
  }

  .about-features li i {
    color: var(--primary);
    font-size: 18px;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .about-features li strong {
    color: var(--dark);
  }

  .about-team {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 20px 25px;
    background: var(--light);
    border-radius: 16px;
    border: 1px solid #ede9fe;
  }

  .team-avatars {
    display: flex;
  }

  .team-avatars .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-left: -8px;
    font-weight: 700;
    font-size: 13px;
    color: white;
  }

  .team-avatars .avatar:first-child { margin-left: 0; background: linear-gradient(135deg, #7c3aed, #a855f7); }
  .team-avatars .avatar:nth-child(2) { background: linear-gradient(135deg, #e879f9, #c084fc); }
  .team-avatars .avatar:nth-child(3) { background: linear-gradient(135deg, #4c1d95, #7c3aed); }

  .team-info strong {
    display: block;
    font-size: 14px;
    color: var(--dark);
    font-weight: 700;
  }

  .team-info span {
    font-size: 12px;
    color: var(--gray);
  }

  /* ===== DESTINATIONS ===== */
  .destinations {
    background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7c3aed 100%);
    padding: 100px 0;
    position: relative;
    overflow: hidden;
  }

  .destinations::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .destinations .section-title {
    color: white;
  }

  .destinations .section-desc {
    color: rgba(255,255,255,0.7);
  }

  .destinations .section-tag {
    background: rgba(255,255,255,0.15);
    color: var(--accent);
  }

  .dest-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    position: relative;
    z-index: 2;
  }

  .dest-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 28px 22px;
    text-align: center;
    transition: all 0.4s;
    cursor: pointer;
  }

  .dest-card:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    border-color: rgba(232, 121, 249, 0.5);
  }

  .dest-card-emoji {
    font-size: 45px;
    margin-bottom: 15px;
    display: block;
  }

  .dest-card-name {
    font-size: 17px;
    font-weight: 700;
    color: white;
    margin-bottom: 6px;
  }

  .dest-card-country {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 15px;
  }

  .dest-card-tag {
    display: inline-block;
    background: linear-gradient(135deg, rgba(232, 121, 249, 0.3), rgba(124, 58, 237, 0.3));
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(192, 132, 252, 0.3);
  }

  /* ===== CONTACT ===== */
  .contact {
    background: #faf9ff;
  }

  .contact-wrapper {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 60px;
    align-items: start;
  }

  .contact-info-card {
    background: linear-gradient(135deg, #4c1d95, #7c3aed, #a855f7);
    border-radius: 24px;
    padding: 40px;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .contact-info-card::after {
    content: '';
    position: absolute;
    bottom: -30%;
    right: -20%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(232, 121, 249, 0.3) 0%, transparent 70%);
  }

  .contact-info-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .contact-info-desc {
    font-size: 14px;
    opacity: 0.8;
    line-height: 1.7;
    margin-bottom: 35px;
  }

  .contact-items {
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: relative;
    z-index: 1;
  }

  .contact-item {
    display: flex;
    gap: 15px;
    align-items: flex-start;
  }

  .contact-item-icon {
    width: 46px;

    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .contact-item-info strong {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .contact-item-info span {
    font-size: 13px;
    opacity: 0.75;
  }

    z-index: 1;
  }
