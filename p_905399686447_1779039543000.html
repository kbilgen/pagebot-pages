<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petitnuage.co | Bulutların Üzerinde Stil</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #c9a96e;
            --primary-light: #e8d5b0;
            --primary-dark: #a07840;
            --accent: #d4a8c7;
            --accent-dark: #b07898;
            --dark: #1a1a2e;
            --dark-mid: #2d2d44;
            --mid: #4a4a6a;
            --light: #f8f4f0;
            --white: #ffffff;
            --text: #3a3a5c;
            --text-light: #7a7a9a;
            --gradient-hero: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 40%, #3d2b4e 100%);
            --gradient-gold: linear-gradient(135deg, #c9a96e 0%, #e8d5b0 50%, #c9a96e 100%);
            --gradient-section: linear-gradient(160deg, #f8f4f0 0%, #f0e8f0 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text);
            background: var(--light);
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s ease;
        }

        nav.scrolled {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            padding: 14px 40px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--white);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-logo span {
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary-light);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--white);
            transition: all 0.3s ease;
        }

        /* ===== HERO ===== */
        #hero {
            min-height: 100vh;
            background: var(--gradient-hero);
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .hero-particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: var(--primary);
            top: -200px;
            right: -100px;
            animation: blob-move 8s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            bottom: -100px;
            left: -50px;
            animation: blob-move 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes blob-move {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-text {
            animation: fade-up 1s ease forwards;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(201, 169, 110, 0.15);
            border: 1px solid rgba(201, 169, 110, 0.4);
            color: var(--primary-light);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .hero-badge i {
            font-size: 0.65rem;
            color: var(--primary);
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.8rem, 5vw, 4.5rem);
            font-weight: 300;
            color: var(--white);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero-title .highlight {
            font-style: italic;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 400;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.65);
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 300;
            max-width: 480px;
        }

        .hero-cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-gold);
            color: var(--dark);
            padding: 15px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(201, 169, 110, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(201, 169, 110, 0.5);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--white);
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.6);
            transform: translateY(-3px);
        }

        .hero-visual {
            position: relative;
            animation: fade-up 1s ease 0.3s both;
        }

        .hero-card-main {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-card-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-gold);
        }

        .hero-icon-wrap {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(201,169,110,0.2), rgba(212,168,199,0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(201, 169, 110, 0.3);
        }

        .hero-icon-wrap i {
            font-size: 2.5rem;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--white);
            margin-bottom: 10px;
            font-style: italic;
        }

        .hero-card-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .hero-scroll {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: scroll-bounce 2s ease-in-out infinite;
        }

        .scroll-line {
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, rgba(201,169,110,0.6), transparent);
        }

        @keyframes scroll-bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* ===== MARQUEE ===== */
        .marquee-section {
            background: var(--dark-mid);
            padding: 18px 0;
            overflow: hidden;
            border-top: 1px solid rgba(201, 169, 110, 0.2);
            border-bottom: 1px solid rgba(201, 169, 110, 0.2);
        }

        .marquee-track {
            display: flex;
            gap: 50px;
            animation: marquee 20s linear infinite;
            white-space: nowrap;
        }

        .marquee-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.5);
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .marquee-item i {
            color: var(--primary);
            font-size: 0.6rem;
        }

        @keyframes marquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* ===== SECTION COMMONS ===== */
        section {
            padding: 100px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .section-tag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .section-tag::before,
        .section-tag::after {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background: var(--primary);
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .section-desc {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.9;
            max-width: 600px;
        }

        /* ===== HİZMETLER ===== */
        #hizmetler {
            background: var(--gradient-section);
            position: relative;
            overflow: hidden;
        }

        #hizmetler::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,168,199,0.08), transparent 70%);
        }

        .services-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .services-header .section-title {
            color: var(--dark);
        }

        .services-header .section-tag {
            justify-content: center;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .service-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            border: 1px solid rgba(201, 169, 110, 0.1);
            cursor: pointer;
        }

        .service-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-gold);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 60px rgba(26, 26, 46, 0.12);
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-card.featured {
            background: var(--gradient-hero);
            color: var(--white);
            border-color: transparent;
        }

        .service-card.featured .service-title,
        .service-card.featured .service-desc {
            color: var(--white);
        }

        .service-card.featured .service-desc {
            color: rgba(255,255,255,0.7);
        }

        .service-card.featured .service-num {
            color: rgba(255,255,255,0.2);
        }

        .service-card.featured::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-gold);
        }

        .service-card.featured::before {
            display: none;
        }

        .service-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            color: rgba(201, 169, 110, 0.2);
            position: absolute;
            top: 20px;
            right: 25px;
            line-height: 1;
        }

        .service-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 1.4rem;
        }

        .service-icon.gold {
            background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
            color: var(--primary-dark);
            border: 1px solid rgba(201, 169, 110, 0.25);
        }

        .service-icon.pink {
            background: linear-gradient(135deg, rgba(212,168,199,0.15), rgba(212,168,199,0.05));
            color: var(--accent-dark);
            border: 1px solid rgba(212, 168, 199, 0.25);
        }

        .service-icon.white {
            background: rgba(255,255,255,0.1);
            color: var(--primary-light);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .service-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 12px;
        }

        .service-desc {
            font-size: 0.83rem;
            color: var(--text-light);
            line-height: 1.8;
        }

        .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .service-tag {
            background: rgba(201, 169, 110, 0.1);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .service-card.featured .service-tag {
            background: rgba(255,255,255,0.1);
            color: var(--primary-light);
        }

        /* ===== HAKKIMIZDA ===== */
        #hakkimizda {
            background: var(--white);
            position: relative;
            overflow: hidden;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .about-visual {
            position: relative;
        }

        .about-main-card {
            background: var(--gradient-hero);
            border-radius: 24px;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }

        .about-main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-gold);
        }

        .about-big-icon {
            font-size: 4rem;
            margin-bottom: 25px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .about-quote {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-style: italic;
            color: var(--white);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .about-quote-author {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .about-float-card {
            position: absolute;
            background: var(--white);
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 0 15px 40px rgba(26, 26, 46, 0.15);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .about-float-card.card-1 {
            bottom: -20px;
            right: -20px;
        }

        .about-float-card.card-2 {
            top: 30px;
            left: -25px;
        }

        .float-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .float-icon.gold { background: linear-gradient(135deg, #c9a96e, #a07840); color: white; }
        .float-icon.pink { background: linear-gradient(135deg, #d4a8c7, #b07898); color: white; }

        .float-text-wrap .float-label {
            font-size: 0.65rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .float-text-wrap .float-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: var(--dark);
            font-weight: 600;
        }

        .about-content .section-title {
            color: var(--dark);
        }

        .about-content .section-desc {
            margin-bottom: 30px;
        }

        .about-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .about-features li {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            font-size: 0.85rem;
            color: var(--text);
            line-height: 1.7;
        }

        .feature-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(201,169,110,0.2), rgba(212,168,199,0.2));
            border: 1px solid rgba(201, 169, 110, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .feature-check i {
            font-size: 0.6rem;
            color: var(--primary-dark);
        }

        .about-social {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link.instagram {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
        }

        .social-link.instagram:hover {
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.4);
        }

        .social-label {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .social-label strong {
            display: block;
            color: var(--dark);
            font-size: 0.85rem;
        }

        /* ===== VALUES ===== */
        #degerler {
            background: var(--dark);
            padding: 80px 0;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
        }

        .value-item {
            padding: 45px 30px;
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.06);
            transition: background 0.3s ease;
        }

        .value-item:last-child {
            border-right: none;
        }

        .value-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .value-icon {
            font-size: 2rem;
            margin-bottom: 18px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .value-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            color: var(--white);
            margin-bottom: 10px;
        }

        .value-text {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.45);
            line-height: 1.7;
        }

        /* ===== İLETİŞİM ===== */
        #iletisim {
            background: var(--gradient-section);
            position: relative;
            overflow: hidden;
        }

        #iletisim::before {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,169,110,0.07), transparent 70%);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 60px;
            align-items: start;
        }

        .contact-info .section-title {
            color: var(--dark);
        }

        .contact-info .section-desc {
            margin-bottom: 40px;
        }
